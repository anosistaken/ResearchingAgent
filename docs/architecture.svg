<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #000000; }
      .box { fill: #0a0a0a; stroke: #262626; stroke-width: 1.5; }
      .box-winner { fill: #0d0d0d; stroke: #ffffff; stroke-width: 2; }
      .text-head { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #ffffff; }
      .text-sub { font-family: "SF Mono", Consolas, Menlo, monospace; font-size: 10px; fill: #777777; }
      .text-agent { font-family: "SF Mono", Consolas, Menlo, monospace; font-size: 11px; fill: #dddddd; }
      .arrow { stroke: #444444; stroke-width: 1.5; stroke-dasharray: 4, 3; }
      .arrow-solid { stroke: #ffffff; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="860" height="260" class="bg" />

  <!-- Step 1: Input & Search Grounding -->
  <rect x="20" y="40" width="160" height="180" rx="4" class="box" />
  <text x="36" y="70" class="text-head">1. Grounding</text>
  <text x="36" y="90" class="text-sub">USER QUESTION</text>
  <text x="36" y="115" class="text-agent">+ Hard constraints</text>
  <text x="36" y="145" class="text-sub">LIVE SEARCH API</text>
  <text x="36" y="170" class="text-agent">Tavily / Brave / Serper</text>
  <text x="36" y="195" class="text-sub">Pulls real benchmarks</text>

  <!-- Flow line 1 -->
  <line x1="180" y1="130" x2="230" y2="130" class="arrow" />

  <!-- Step 2: Parallel Agents -->
  <rect x="230" y="20" width="280" height="220" rx="4" class="box" />
  <text x="246" y="48" class="text-head">2. Parallel Analysis Agents</text>
  <text x="246" y="66" class="text-sub">CONCURRENT EVALUATION</text>

  <!-- Sub agent cards -->
  <rect x="246" y="80" width="248" height="32" rx="2" fill="#121212" stroke="#222" />
  <text x="256" y="100" class="text-agent">Agent Anthropic (Claude 3.5)</text>

  <rect x="246" y="118" width="248" height="32" rx="2" fill="#121212" stroke="#222" />
  <text x="256" y="138" class="text-agent">Agent OpenAI (GPT-4o)</text>

  <rect x="246" y="156" width="248" height="32" rx="2" fill="#121212" stroke="#222" />
  <text x="256" y="176" class="text-agent">Agent Google (Gemini 1.5)</text>

  <rect x="246" y="194" width="248" height="32" rx="2" fill="#121212" stroke="#222" />
  <text x="256" y="214" class="text-agent">Agent Local / Groq (Llama 3)</text>

  <!-- Flow line 2 -->
  <line x1="510" y1="130" x2="560" y2="130" class="arrow" />

  <!-- Step 3: Synthesis Engine & Output -->
  <rect x="560" y="40" width="280" height="180" rx="4" class="box-winner" />
  <text x="576" y="70" class="text-head">3. Greg Consensus Filter</text>
  <text x="576" y="90" class="text-sub">SYNTHESIZED ARTIFACTS</text>

  <text x="576" y="120" class="text-agent">✔ ONE Decisive Winner</text>
  <text x="576" y="145" class="text-agent">✔ Matrix of What Matters</text>
  <text x="576" y="170" class="text-agent">✔ Cut Fluff &amp; Noise</text>
  <text x="576" y="195" class="text-agent">✔ Explicit Uncertainties</text>
</svg>

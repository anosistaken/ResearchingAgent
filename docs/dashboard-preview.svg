<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #000000; }
      .border { stroke: #262626; stroke-width: 1.5; }
      .accent-border { stroke: #ffffff; stroke-width: 2; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 700; fill: #ffffff; letter-spacing: 0.5px; }
      .text-sub { font-family: "SF Mono", Consolas, Menlo, monospace; font-size: 11px; fill: #888888; }
      .text-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 20px; font-weight: 800; fill: #ffffff; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #cccccc; }
      .text-mono { font-family: "SF Mono", Consolas, Menlo, monospace; font-size: 11px; fill: #a0a0a0; }
      .badge-bg { fill: #ffffff; }
      .badge-text { font-family: "SF Mono", Consolas, Menlo, monospace; font-size: 10px; font-weight: 800; fill: #000000; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="860" height="480" class="bg" />

  <!-- Window Header -->
  <rect x="20" y="20" width="820" height="44" rx="4" fill="#0d0d0d" class="border" />
  <circle cx="44" cy="42" r="5" fill="#333333" />
  <circle cx="62" cy="42" r="5" fill="#333333" />
  <circle cx="80" cy="42" r="5" fill="#333333" />
  <text x="110" y="46" class="text-sub">http://localhost:3000: GREG DECISION ENGINE</text>
  <rect x="710" y="32" width="110" height="20" rx="2" fill="#181818" />
  <text x="720" y="46" class="text-sub">4 ENGINES SYNC</text>

  <!-- Query Bar -->
  <rect x="20" y="78" width="820" height="52" rx="4" fill="#090909" class="border" />
  <text x="36" y="98" class="text-sub">QUERY &amp; CONSTRAINTS</text>
  <text x="36" y="116" class="text-body">"PostgreSQL vs MongoDB vs SQLite for 10M events/day, single node budget"</text>
  <rect x="730" y="88" width="94" height="32" rx="2" fill="#ffffff" />
  <text x="752" y="108" class="badge-text">DECIDE</text>

  <!-- Verdict Banner -->
  <rect x="20" y="144" width="820" height="114" rx="4" fill="#0a0a0a" class="accent-border" />
  <rect x="36" y="160" width="144" height="20" fill="#ffffff" />
  <text x="44" y="174" class="badge-text">RECOMMENDED WINNER</text>
  <text x="710" y="174" class="text-sub">CONFIDENCE: HIGH</text>
  <text x="36" y="210" class="text-bold">PostgreSQL</text>
  <text x="36" y="235" class="text-body">→ Superior write-throughput predictability, zero lock-in risk, rock-solid index tooling under continuous ingestion.</text>

  <!-- Matrix Card -->
  <rect x="20" y="272" width="460" height="188" rx="4" fill="#090909" class="border" />
  <text x="36" y="296" class="text-sub">WHAT ACTUALLY MATTERS (COMPARISON MATRIX)</text>
  
  <line x1="20" y1="308" x2="480" y2="308" stroke="#1f1f1f" />
  <text x="36" y="330" class="text-mono">Metric</text>
  <text x="170" y="330" class="text-mono">PostgreSQL</text>
  <text x="280" y="330" class="text-mono">MongoDB</text>
  <text x="380" y="330" class="text-mono">SQLite</text>
  <line x1="20" y1="342" x2="480" y2="342" stroke="#1a1a1a" />

  <text x="36" y="364" class="text-mono">Consensus</text>
  <text x="170" y="364" class="text-body" font-weight="700">92 / 100</text>
  <text x="280" y="364" class="text-body">83 / 100</text>
  <text x="380" y="364" class="text-body">74 / 100</text>

  <text x="36" y="394" class="text-mono">Advantage</text>
  <text x="170" y="394" class="text-body">Mature scale</text>
  <text x="280" y="394" class="text-body">Schema agility</text>
  <text x="380" y="394" class="text-body">Zero server</text>

  <text x="36" y="424" class="text-mono">Dealbreaker</text>
  <text x="170" y="424" class="text-body">Heavy memory</text>
  <text x="280" y="424" class="text-body">RAM footprint</text>
  <text x="380" y="424" class="text-body">Write locking</text>

  <!-- Right Side Column: Noise & Uncertainties -->
  <rect x="494" y="272" width="346" height="90" rx="4" fill="#090909" class="border" />
  <text x="510" y="295" class="text-sub">DISCARDED MARKETING FLUFF</text>
  <text x="510" y="318" class="text-body">✕ Proprietary "AI-native cloud storage" claims</text>
  <text x="510" y="340" class="text-body">✕ Synthetic micro-benchmarks with zero real query load</text>

  <rect x="494" y="370" width="346" height="90" rx="4" fill="#090909" class="border" />
  <text x="510" y="393" class="text-sub">UNCERTAINTIES (NO GUESSING)</text>
  <text x="510" y="416" class="text-body">⚠ Operational burden depends on team's query tuning skill</text>
  <text x="510" y="438" class="text-body">⚠ Pricing variance if offloading to managed cloud tiers</text>
</svg>
